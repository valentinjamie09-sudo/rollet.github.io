<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roulette Classic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎰 Roulette Classic</h1>
      <div class="balance">💰 Kontostand: <span id="balance">1000</span> Chips</div>
    </header>

    <main>
      <div class="roulette-section">
        <canvas id="wheel" width="400" height="400"></canvas>
        <div id="ball"></div>
      </div>

      <div class="control-section">
        <h2>Willkommen beim Roulette Classic!</h2>

        <label for="bet">Dein Einsatz:</label>
        <input type="number" id="bet" value="5" min="1" />

        <div class="color-buttons">
          <button id="redBtn" class="btn red">Rot</button>
          <button id="blackBtn" class="btn black">Schwarz</button>
        </div>

        <button id="spinBtn" class="btn spin">🎡 Drehen!</button>

        <div id="result"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>

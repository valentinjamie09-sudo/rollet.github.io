<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Classic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎰 Roulette Classic</h1>
      <div class="balance">💰 Kontostand: <span id="balance">1000</span> Chips</div>
    </header>

    <div class="card">
      <div class="wheel-wrap">
        <div class="wheel-stage">
          <canvas id="wheel" width="400" height="400"></canvas>
          <div id="ball" class="ball"></div>
          <div class="pointer"></div>
        </div>
      </div>

      <div class="controls">
        <h3>Willkommen beim Roulette Classic!</h3>

        <label>Dein Einsatz:</label>
        <input type="number" id="bet" min="1" max="1000" value="5">

        <div class="color-bets">
          <button id="bet-red" class="btn red">Rot</button>
          <button id="bet-black" class="btn black">Schwarz</button>
        </div>

        <p>Oder wähle eine Zahl (0–36):</p>
        <div id="number-grid" class="number-grid"></div>

        <button id="spin" class="btn spin">🎡 Drehen!</button>
        <div id="result" class="result"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

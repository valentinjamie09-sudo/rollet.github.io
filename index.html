<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roulette Classic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎰 Roulette Classic</h1>
      <div class="balance">💰 Kontostand: <span id="balance">1000</span> Chips</div>
    </header>

    <div class="game">
      <div class="wheel-wrap">
        <canvas id="wheel"></canvas>
        <div class="ball"></div>
      </div>

      <div class="panel">
        <h3>Willkommen beim Roulette Classic!</h3>
        <label>Dein Einsatz:</label>
        <input type="number" id="bet" min="1" value="5" />
        <div class="buttons">
          <button id="betRed" class="btn red">Rot</button>
          <button id="betBlack" class="btn black">Schwarz</button>
        </div>
        <p>Oder wähle eine Zahl:</p>
        <button id="spin" class="spin-btn">🎡 Drehen!</button>
        <div id="result" class="result"> </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mimo Roulette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>🎰 Mimo Roulette 🎰</h1>
    <p class="balance">💰 Kontostand: <span id="balance">1000</span> Chips</p>

    <div class="roulette">
      <div class="wheel" id="wheel"></div>
      <div class="pointer"></div>
    </div>

    <div class="welcome">Willkommen beim Mimo Roulette!</div>

    <div class="betting">
      <label for="bet">Dein Einsatz:</label>
      <input type="number" id="bet" min="1" value="10">
      <button id="redBtn" class="color-btn red">Rot</button>
      <button id="blackBtn" class="color-btn black">Schwarz</button>
    </div>

    <div class="number-pick">
      <p>Oder wähle eine Zahl:</p>
      <div class="number-grid" id="numberGrid"></div>
    </div>

    <button id="spinBtn" class="spin-btn" disabled>🎯 Drehen!</button>

    <p id="result" class="result-msg"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
